name: Probe club crests (temporary)
on:
  push:
    branches: [claude/torneo-balon-oro-votacion-9hgcf4]
    paths: ['.github/probe/**', '.github/workflows/probe-crests.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node .github/probe/crests.mjs
