name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npm run build
      - name: Notification bundle is up to date with the domain code
        run: |
          npm run build:notify
          git diff --exit-code supabase/functions/notify/domain.js
