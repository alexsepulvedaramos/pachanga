name: Update club ratings

# Rebuilds public/data/clubs/<edition>.json from EA's public player ratings every day and commits
# it when something changed, which redeploys the app. The script refuses to overwrite the file
# when the feed looks like it moved to another game edition; the run then fails on purpose.

on:
  schedule:
    - cron: '40 5 * * *'
  workflow_dispatch:
    inputs:
      edition:
        description: 'Game edition id (fc26, fc27…)'
        required: false
        default: 'fc26'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Rebuild ratings
        run: node --no-warnings scripts/update-club-ratings.ts "${{ inputs.edition || 'fc26' }}"
      - name: Commit changes
        run: |
          # Staged first so new files (a new edition, a new club's crest) count as changes too.
          git add public/data
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update club ratings"
          git push
